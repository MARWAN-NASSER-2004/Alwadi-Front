<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الوادي</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="style/variables.css">
    <link rel="stylesheet" href="css/hero.css">
</head>

<body>
    <section id="hero" class="hero">
        <div class="hero-overlay"></div>

        <div class="hero-slide slide-1">
            <h1 class="hero-title">50 عاماً من الجودة والثقة</h1>
            <p class="hero-subtitle">رحلة بدأت من حلم سعودي وأصبحت إرثاً وطنياً</p>

            <div class="scroll-icon">
                <span></span>
            </div>
        </div>

        <div class="hero-slide slide-2">
            <div class="hero-year">1975</div>
            <h1 class="hero-title-2">بداية الحلم</h1>
            <p class="hero-text">
                بدأت قصتنا في مدينة الخرج بحلم بسيط: تقديم دجاج طازج بجودة لا تضاهى
                للعائلات السعودية. اليوم، نفخر بإنتاج 80 مليون طائر سنوياً، مع الحفاظ على
                نفس القيم والمبادئ التي بدأنا بها.
            </p>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollSmoother.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollToPlugin.min.js"></script>

    <script src="js/animations.js"></script>
</body>

</html>
